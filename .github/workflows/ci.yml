name: Validación Go Linux

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Pruebas completas e integración SSH local
        run: go test -timeout 90s ./...
      - name: Análisis estático
        run: go vet ./...
      - name: Auditoría de vulnerabilidades
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Compilación estática
        run: CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags="-s -w" -o kagssh ./cmd/kagssh
      - name: Comprobar enlazado
        run: |
          file kagssh
          ! readelf -l kagssh | grep -q INTERP
